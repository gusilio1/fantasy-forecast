name: Hourly forecast

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (UTC). GitHub may start it a few minutes late.
  workflow_dispatch:           # "Run workflow" button for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two forecasts at once; a new one waits for the previous to finish.
concurrency:
  group: hourly-forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run forecast pipeline
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          TZ: America/New_York
        run: python run_pipeline.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
